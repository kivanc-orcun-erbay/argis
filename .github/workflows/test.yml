name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No packages to install: these tests use only Node's built-in modules.
      - name: Page scripts, data block and soil-test factors
        run: node tests/model.cjs
      - name: Model unit tests
        run: node --test tests/unit.cjs
      - name: Regional checks on the embedded NASA data
        run: node tests/regions.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Outside services (NASA POWER, SoilGrids, MODIS, map tiles) are mocked from data/raw.
      # Leaflet itself still loads from cdnjs, so the runner needs internet access.
      - name: Browser tests (Playwright + axe)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
